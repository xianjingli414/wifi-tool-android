[tool.briefcase]
project_name = "WiFi采集管理工具"
bundle = "com.example.wifitool"
version = "1.0.0"
url = "https://example.com"
author = "WiFiTool"
author_email = "admin@example.com"
license = "MIT"

[tool.briefcase.app.wifi_tool_android]
formal_name = "WiFi采集管理工具"
description = "WiFi 采集与单位关联管理工具"
sources = ["src/wifi_tool_android"]
requires = ["kivy>=2.3.0", "openpyxl"]

[tool.briefcase.app.wifi_tool_android.android]
compile_sdk = "34"
build_tools_version = "34.0.0"
min_sdk = "24"
target_sdk = "34"
permissions = [
    "ACCESS_FINE_LOCATION",
    "ACCESS_COARSE_LOCATION",
    "ACCESS_WIFI_STATE",
    "CHANGE_WIFI_STATE",
    "READ_PHONE_STATE",
]
