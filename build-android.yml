name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase kivy openpyxl
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n491a1d8c218076ff8c9139fd4854ef5c8308c85" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n869579757292342396489007dfdcec84e587f0f6" > $ANDROID_HOME/licenses/android-sdk-license
    
    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Create Briefcase project
      run: python -m briefcase create android
    
    - name: Build APK
      run: python -m briefcase build android
    
    - name: Package APK
      run: python -m briefcase package android
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wifi-tool-android-apk
        path: build/wifi_tool_android/android/gradle/APP_NAME/*.apk
        if-no-files-found: error
