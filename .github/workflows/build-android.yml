name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y           git zip unzip openjdk-17-jdk           autoconf libtool pkg-config zlib1g-dev           libncurses5-dev libncursesw5-dev           cmake libffi-dev libssl-dev           python3 python3-pip python3-venv           cython
    
    - name: Install Buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install cython buildozer
        pip3 install kivy[base] openpyxl
    
    - name: Build APK with Buildozer
      timeout-minutes: 60
      run: |
        buildozer -v android debug 2>&1 | tee buildozer_log.txt
      continue-on-error: true
    
    - name: Check build output
      run: |
        echo "Checking bin/ directory..."
        ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
        echo "Checking .buildozer/ directory..."
        ls -la .buildozer/ 2>/dev/null | head -20 || echo ".buildozer/ directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wifi-tool-android-apk
        path: |
          bin/*.apk
          buildozer_log.txt
        retention-days: 30
