name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install briefcase kivy openpyxl
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create Briefcase project
      run: python -m briefcase create android
    
    - name: Build APK
      run: python -m briefcase build android
    
    - name: Package APK
      run: python -m briefcase package android
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wifi-tool-android-apk
        path: build/**/*.apk
        if-no-files-found: error
